name: C++ CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / C++20
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Test optional forecast models
        if: runner.os == 'Linux'
        run: |
          python3 -m venv .venv-forecast-tests
          .venv-forecast-tests/bin/python -m pip install -r python/requirements-forecast.txt -r python/requirements-ml.txt
          .venv-forecast-tests/bin/python tests/test_classical_forecasts.py
          .venv-forecast-tests/bin/python tests/test_boosted_forecasts.py
